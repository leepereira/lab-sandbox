name: Outputs
on: workflow_dispatch
jobs:
  vars:
    runs-on: ubuntu-latest
    outputs:
      color: ${{ steps.pick.outputs.color }}
    steps:
      - id: pick
        run: echo "color=blue" >> "$GITHUB_OUTPUT"
  report:
    needs: [vars]
    runs-on: ubuntu-latest
    steps:
      - run: echo "color is ${{ needs.vars.outputs.color }}"
  late:
    needs: [report, vars]
    runs-on: ubuntu-latest
    steps:
      - run: echo "color is still ${{ needs.vars.outputs.color }}"
